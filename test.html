<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
<style>
button {
    margin: 5px;
    padding: 10px;
    border-radius: 5px;
}
.selected {
    box-shadow: 3px 3px 5px 0px rgba(0, 0, 0, 0.5);
    position: relative;
    top: -2px;
    left: -2px;
}
button > span:before {
    content: "; ";
}
button > span:first-child:before {
    content: "";
}
.complete {
    border: 2px solid #000;
}
.complete:before {
    content: "✓ ";
}
</style>
</head>
<body>
<div id="board"></div>
<div id="status"></div>
<script src="game.js"></script>
</body>
</html>
